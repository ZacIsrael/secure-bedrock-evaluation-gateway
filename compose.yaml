services:
  # Run the SPIRE server using the exact image pinned for this project.
  # The server issues identities and stores workload registrations.
  spire-server:
    image: ${SPIRE_SERVER_IMAGE:?Set SPIRE_SERVER_IMAGE in images.lock.env}
    platform: ${CONTAINER_PLATFORM:?Set CONTAINER_PLATFORM in images.lock.env}

    # Load the server configuration from the path inside the container.
    command: ["-config", "/opt/spire/conf/server/server.conf"]

    volumes:
      # Mount the reviewed configuration without allowing container writes.
      - ./spire/server/server.conf:/opt/spire/conf/server/server.conf:ro

      # Preserve the server database and signing keys across restarts.
      - spire-server-data:/var/lib/spire/server

    # Check whether SPIRE is ready to serve requests.
    # The release image has no shell, so call the binary directly.
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Run the pinned SPIRE agent after the server is healthy.
  spire-agent:
    image: ${SPIRE_AGENT_IMAGE:?Set SPIRE_AGENT_IMAGE in images.lock.env}
    platform: ${CONTAINER_PLATFORM:?Set CONTAINER_PLATFORM in images.lock.env}
    # Let the agent identify processes in the workload containers.
    pid: "host"
    depends_on:
      spire-server:
        condition: service_healthy

    # Read the one-time join token from a local, untracked file.
    command:
      - -config
      - /opt/spire/conf/agent/agent.conf
      - -joinTokenFile
      - /run/spire/agent/join-token

    volumes:
      # Supply the agent configuration and server trust bundle.
      - ./spire/agent/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./spire/agent/bootstrap.pem:/opt/spire/conf/agent/bootstrap.pem:ro
      - ./spire/agent/join-token:/run/spire/agent/join-token:ro

      # Preserve agent state and share its Workload API socket later.
      - spire-agent-data:/var/lib/spire/agent
      - spire-agent-socket:/run/spire/agent/public

      # Let the agent identify Docker workloads.
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test:
        [
          "CMD",
          "/opt/spire/bin/spire-agent",
          "healthcheck",
          "-socketPath",
          "/run/spire/agent/public/api.sock",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Validate incoming SPIRE identities and authorize only the client.
  gateway:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE in images.lock.env}
    platform: ${CONTAINER_PLATFORM:?Set CONTAINER_PLATFORM in images.lock.env}
    command: ["node", "dist/gateway.js"]
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent/public/api.sock
    depends_on:
      spire-agent:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/run/spire/agent/public

  # Request a gateway-scoped JWT-SVID and call the authorization endpoint.
  client:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE in images.lock.env}
    platform: ${CONTAINER_PLATFORM:?Set CONTAINER_PLATFORM in images.lock.env}
    command: ["node", "dist/client.js"]
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent/public/api.sock
    depends_on:
      gateway:
        condition: service_started
    volumes:
      - spire-agent-socket:/run/spire/agent/public
      - ./eval/cases/development.jsonl:/app/eval/cases/development.jsonl:ro

volumes:
  # Keep SPIRE server state in a Docker-managed volume.
  spire-server-data:

  # Keep the agent's keys and other state across restarts.
  spire-agent-data:

  # Share the agent's Workload API socket with future workloads.
  spire-agent-socket:
