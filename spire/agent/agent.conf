agent {
  # Join the same trust domain as the SPIRE server.
  trust_domain = "secure-bedrock-evaluation-gateway.local"

  # Verify the server against the public bundle you just exported.
  trust_bundle_path = "/opt/spire/conf/agent/bootstrap.pem"

  # Reach the server by its Compose service name.
  server_address = "spire-server"
  server_port    = "8081"

  # Keep agent state persistent and expose its Workload API socket.
  data_dir    = "/var/lib/spire/agent"
  socket_path = "/run/spire/agent/public/api.sock"

  log_level = "INFO"
}

plugins {
  # Attest this agent using a server-generated, single-use join token.
  NodeAttestor "join_token" {
    plugin_data {}
  }

  # Preserve the agent's keys across container restarts.
  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }

  # Identify workloads by their Docker container properties.
  WorkloadAttestor "docker" {
    plugin_data {}
  }
}