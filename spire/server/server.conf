server {
  # Use one trust domain for this project's SPIFFE identities.
  trust_domain = "secure-bedrock-evaluation-gateway.local"

  # Listen on the Docker network so the SPIRE agent can connect.
  bind_address = "0.0.0.0"
  bind_port    = "8081"

  # Store server state in the directory backed by the Compose volume.
  data_dir = "/var/lib/spire/server"

  # Place the server's local API socket in the container.
  socket_path = "/tmp/spire-server/private/api.sock"

  log_level = "INFO"
}

plugins {
  # Persist agent and workload registrations in a local SQLite database.
  DataStore "sql" {
    plugin_data {
      database_type     = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }

  # Allow the development agent to attest with a single-use join token.
  NodeAttestor "join_token" {
    plugin_data {}
  }

  # Persist the server's signing keys in the same Docker volume.
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/spire/server/keys.json"
    }
  }
}